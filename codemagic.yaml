# CodeSnack 1.1 — Liquid Glass iPhone build
# GitHub Pages: https://yulma-02.github.io/codesnack/
# Keep ios/ and codemagic.yaml at the repository root, alongside index.html.
# Only "ios-unsigned-ipa" produces a device IPA intended for AltStore Classic.

workflows:
  ios-unsigned-ipa:
    name: "01 - CodeSnack Liquid Glass · 아이폰용 무료 IPA (AltStore)"
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
    scripts:
      - name: Xcode 프로젝트 및 신규 모바일 UI 확인
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/CodeSnack/DesignSystem.swift"
          test -f "$CM_BUILD_DIR/ios/CodeSnack/LearningView.swift"
          test -f "$CM_BUILD_DIR/ios/CodeSnack/WebBridge.swift"
          echo "CodeSnack Liquid Glass native UI sources found"
          xcodebuild -version
      - name: 아이폰 실기기 대상 빌드 (서명 생략)
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/device" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/device-xcodebuild.log"
      - name: 미서명 CodeSnack IPA 패키징
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/CodeSnack.app"
          IPA="$CM_BUILD_DIR/build/CodeSnack-LiquidGlass-unsigned.ipa"
          WORK="$CM_BUILD_DIR/build/unsigned_ipa_work"
          test -d "$APP" || { echo "Cannot find device app: $APP"; exit 1; }
          test -f "$APP/Info.plist" || { echo "Missing Info.plist"; exit 1; }
          test -f "$APP/CodeSnack" || { echo "Missing executable"; exit 1; }
          /usr/bin/lipo -archs "$APP/CodeSnack" | grep -qw arm64 || { echo "Not an arm64 iPhone app"; exit 1; }
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          /usr/bin/ditto "$APP" "$WORK/Payload/CodeSnack.app"
          (cd "$WORK" && /usr/bin/ditto -c -k --keepParent Payload "$IPA")
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | grep '^Payload/CodeSnack.app/Info.plist$' >/dev/null
          test -s "$IPA"
          echo "IPA: $IPA"
          echo "Unsigned IPA: use AltStore Classic to sign/install on your own iPhone."
    artifacts:
      - build/CodeSnack-LiquidGlass-unsigned.ipa
      - build/device-xcodebuild.log
      - /tmp/xcodebuild_logs/*.log

  ios-simulator-check:
    name: "02 - CodeSnack Liquid Glass · 시뮬레이터 빌드 검사 (.app만 생성)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: 시뮬레이터 앱 컴파일
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/ios/CodeSnack.xcodeproj" \
            -scheme CodeSnack \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/simulator" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

# CodeSnack 1.1 Liquid Glass - Full iOS source recovery for GitHub + Codemagic
# Upload ios/ AND codemagic.yaml to repo ROOT, alongside index.html.
workflows:
  ios-unsigned-ipa:
    name: 01 - CodeSnack Liquid Glass · 아이폰용 무료 IPA (AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: ios/CodeSnack.xcodeproj
        XCODE_SCHEME: CodeSnack
    scripts:
    - name: iOS 소스 파일 누락 검사 (필수)
      script: "set -euo pipefail\ncd \"$CM_BUILD_DIR\"\nmissing=0\nfor p in \\\n  ios/CodeSnack.xcodeproj/project.pbxproj\
        \ \\\n  ios/CodeSnack.xcodeproj/xcshareddata/xcschemes/CodeSnack.xcscheme \\\n  ios/CodeSnack/CodeSnackApp.swift \\\
        \n  ios/CodeSnack/ContentView.swift \\\n  ios/CodeSnack/DesignSystem.swift \\\n  ios/CodeSnack/LearningView.swift\
        \ \\\n  ios/CodeSnack/StudioView.swift \\\n  ios/CodeSnack/TutorView.swift \\\n  ios/CodeSnack/ProfileView.swift \\\
        \n  ios/CodeSnack/WebBridge.swift \\\n  ios/CodeSnack/MobileWebCSS.swift \\\n  ios/CodeSnack/Info.plist \\\n  ios/CodeSnack/Assets.xcassets/Contents.json;\
        \ do\n  if [ ! -f \"$p\" ]; then\n    echo \"[MISSING] $p\"\n    missing=1\n  fi\ndone\nif [ \"$missing\" -ne 0 ];\
        \ then\n  echo \"\nERROR: GitHub main branch is missing iOS source files.\"\n  echo \"Unzip the FULL project and upload\
        \ the whole ios/ folder to repository root.\"\n  echo \"Expected path: ios/CodeSnack/CodeSnackApp.swift\"\n  exit\
        \ 2\nfi\necho \"OK: All iOS Swift sources, assets and Xcode project are present.\"\n"
    - name: 아이폰 실기기 대상 빌드 (서명 생략)
      script: "set -euo pipefail\nmkdir -p \"$CM_BUILD_DIR/build\"\nLOG=\"$CM_BUILD_DIR/build/device-xcodebuild.log\"\nset\
        \ +e\nxcodebuild build \\\n  -project \"$CM_BUILD_DIR/$XCODE_PROJECT\" \\\n  -scheme \"$XCODE_SCHEME\" \\\n  -configuration\
        \ Release \\\n  -sdk iphoneos \\\n  -destination 'generic/platform=iOS' \\\n  -derivedDataPath \"$CM_BUILD_DIR/build/device\"\
        \ \\\n  CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \\\n  2>&1 | tee \"$LOG\"\nRESULT=${PIPESTATUS[0]}\n\
        set -e\nif [ \"$RESULT\" -ne 0 ]; then\n  echo \"=== CodeSnack iOS Xcode build ERROR summary ===\"\n  grep -n -C 2\
        \ -E 'error:|BUILD FAILED|Command .* failed|fatal error:' \"$LOG\" | tail -n 130 || true\n  echo \"=== Last 35 log\
        \ lines ===\"\n  tail -n 35 \"$LOG\"\n  exit \"$RESULT\"\nfi\necho \"=== CodeSnack iPhone compile success ===\"\n"
    - name: 미서명 CodeSnack IPA 패키징
      script: 'set -euo pipefail

        APP="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/CodeSnack.app"

        IPA="$CM_BUILD_DIR/build/CodeSnack-LiquidGlass-unsigned.ipa"

        WORK="$CM_BUILD_DIR/build/unsigned_ipa_work"

        test -d "$APP" || { echo "Cannot find device app: $APP"; exit 1; }

        test -f "$APP/Info.plist" || { echo "Missing Info.plist"; exit 1; }

        test -f "$APP/CodeSnack" || { echo "Missing executable"; exit 1; }

        /usr/bin/lipo -archs "$APP/CodeSnack" | grep -qw arm64 || { echo "Not an arm64 iPhone app"; exit 1; }

        rm -rf "$WORK"

        mkdir -p "$WORK/Payload"

        /usr/bin/ditto "$APP" "$WORK/Payload/CodeSnack.app"

        (cd "$WORK" && /usr/bin/ditto -c -k --keepParent Payload "$IPA")

        unzip -t "$IPA" >/dev/null

        unzip -Z1 "$IPA" | grep ''^Payload/CodeSnack.app/Info.plist$'' >/dev/null

        test -s "$IPA"

        echo "IPA: $IPA"

        echo "Unsigned IPA: use AltStore Classic to sign/install on your own iPhone."

        '
    artifacts:
    - build/CodeSnack-LiquidGlass-unsigned.ipa
    - build/device-xcodebuild.log
    - /tmp/xcodebuild_logs/*.log
  ios-simulator-check:
    name: 02 - CodeSnack Liquid Glass · 시뮬레이터 빌드 검사 (.app만 생성)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
    - name: iOS 소스 파일 누락 검사 (필수)
      script: "set -euo pipefail\ncd \"$CM_BUILD_DIR\"\nmissing=0\nfor p in \\\n  ios/CodeSnack.xcodeproj/project.pbxproj\
        \ \\\n  ios/CodeSnack.xcodeproj/xcshareddata/xcschemes/CodeSnack.xcscheme \\\n  ios/CodeSnack/CodeSnackApp.swift \\\
        \n  ios/CodeSnack/ContentView.swift \\\n  ios/CodeSnack/DesignSystem.swift \\\n  ios/CodeSnack/LearningView.swift\
        \ \\\n  ios/CodeSnack/StudioView.swift \\\n  ios/CodeSnack/TutorView.swift \\\n  ios/CodeSnack/ProfileView.swift \\\
        \n  ios/CodeSnack/WebBridge.swift \\\n  ios/CodeSnack/MobileWebCSS.swift \\\n  ios/CodeSnack/Info.plist \\\n  ios/CodeSnack/Assets.xcassets/Contents.json;\
        \ do\n  if [ ! -f \"$p\" ]; then\n    echo \"[MISSING] $p\"\n    missing=1\n  fi\ndone\nif [ \"$missing\" -ne 0 ];\
        \ then\n  echo \"\nERROR: GitHub main branch is missing iOS source files.\"\n  echo \"Unzip the FULL project and upload\
        \ the whole ios/ folder to repository root.\"\n  echo \"Expected path: ios/CodeSnack/CodeSnackApp.swift\"\n  exit\
        \ 2\nfi\necho \"OK: All iOS Swift sources, assets and Xcode project are present.\"\n"
    - name: 시뮬레이터 앱 컴파일
      script: "set -euo pipefail\nxcodebuild build \\\n  -project \"$CM_BUILD_DIR/ios/CodeSnack.xcodeproj\" \\\n  -scheme\
        \ CodeSnack \\\n  -configuration Debug \\\n  -sdk iphonesimulator \\\n  -destination 'generic/platform=iOS Simulator'\
        \ \\\n  -derivedDataPath \"$CM_BUILD_DIR/build/simulator\" \\\n  CODE_SIGN_IDENTITY=\"\" CODE_SIGNING_REQUIRED=NO\
        \ CODE_SIGNING_ALLOWED=NO\n"
    artifacts:
    - build/simulator/Build/Products/Debug-iphonesimulator/*.app
    - /tmp/xcodebuild_logs/*.log

# CodeSnack for GitHub Pages + Codemagic
# Place this file at the ROOT of https://github.com/YULMA-02/codesnack
# The ios/ folder must also be at the repository root.
# 01: unsigned simulator build (.app) / 02: unsigned iPhone IPA / 03: Apple developer signed Ad Hoc IPA.
# Unsigned IPA cannot be installed directly. AltStore Classic on your own iPhone must sign it.

workflows:
  ios-simulator-check:
    name: "01 - iOS 시뮬레이터 빌드 검사"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
    scripts:
      - name: Xcode 프로젝트 확인
        script: |
          set -e
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/CodeSnack/ContentView.swift"
      - name: 시뮬레이터 앱 빌드
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/simulator" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-unsigned-ipa:
    name: "02 - 무료 Apple 계정용 미서명 iPhone IPA (AltStore)"
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
    scripts:
      - name: iPhone용 실제 기기 빌드 (서명 없이)
        script: |
          set -euo pipefail
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/device" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/device-xcodebuild.log"
      - name: 미서명 앱을 표준 Payload/ IPA 형태로 묶기
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/device/Build/Products/Release-iphoneos/CodeSnack.app"
          IPA="$CM_BUILD_DIR/build/CodeSnack-unsigned-iphoneos.ipa"
          WORK="$CM_BUILD_DIR/build/unsigned_ipa_work"
          test -d "$APP" || { echo "Missing device app: $APP"; exit 1; }
          test -f "$APP/Info.plist" || { echo "Missing Info.plist"; exit 1; }
          test -f "$APP/CodeSnack" || { echo "Missing app executable"; exit 1; }
          /usr/bin/lipo -archs "$APP/CodeSnack" | grep -qw arm64 || { echo "Not an arm64 iPhone app"; exit 1; }
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          /usr/bin/ditto "$APP" "$WORK/Payload/CodeSnack.app"
          ( cd "$WORK" && /usr/bin/ditto -c -k --keepParent Payload "$IPA" )
          unzip -t "$IPA" >/dev/null
          unzip -Z1 "$IPA" | grep '^Payload/CodeSnack.app/Info.plist$' > /dev/null
          test -s "$IPA"
          echo "Generated: $IPA"
          echo "IMPORTANT: This is UNSIGNED. Install via AltStore Classic to sign it with your own Apple ID."
    artifacts:
      - build/CodeSnack-unsigned-iphoneos.ipa
      - build/device-xcodebuild.log
      - /tmp/xcodebuild_logs/*.log

  ios-adhoc-ipa:
    name: "03 - 유료 Apple Developer Ad Hoc IPA (선택 사항)"
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codesnack-apple
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
        BUNDLE_ID: "io.github.yulma02.codesnack"
    scripts:
      - name: 코드 서명 키체인 준비
        script: keychain initialize
      - name: Ad Hoc 인증서와 프로파일 준비
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC --create
      - name: 인증서 설치
        script: keychain add-certificates
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: 서명된 IPA 생성
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

# CodeSnack — Codemagic iOS workflows
# Place this file at the ROOT of https://github.com/YULMA-02/codesnack
# Existing GitHub Pages files (index.html / pages / js / css / assets) are untouched.
# Workflows are intended to be run MANUALLY from the Codemagic dashboard.
# IMPORTANT: The signed workflow requires an active Apple Developer Program membership.

workflows:
  ios-simulator-check:
    name: "01 - iOS 빌드 검사 (서명 불필요)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
    scripts:
      - name: Xcode 프로젝트 위치 확인
        script: |
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/CodeSnack/ContentView.swift"
          echo "CodeSnack Xcode project found."
      - name: 시뮬레이터용 앱 빌드 (설치용 IPA 아님)
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-adhoc-ipa:
    name: "02 - 아이폰 설치용 IPA (Ad Hoc 서명 필요)"
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Apple Developer Portal integration name set by YOU in Codemagic:
    integrations:
      app_store_connect: codesnack-apple
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/CodeSnack.xcodeproj"
        XCODE_SCHEME: "CodeSnack"
        BUNDLE_ID: "io.github.yulma02.codesnack"
    scripts:
      - name: 프로젝트 및 앱 식별자 확인
        script: |
          test -f "$CM_BUILD_DIR/$XCODE_PROJECT/project.pbxproj"
          echo "Expected Bundle ID: $BUNDLE_ID"
      - name: 인증서 키체인 준비
        script: keychain initialize
      - name: Ad Hoc 인증서 및 프로비저닝 프로파일 가져오기
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create
      - name: 코드 서명 인증서 설치
        script: keychain add-certificates
      - name: 프로젝트에 서명 프로파일 적용
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: IPA 생성
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

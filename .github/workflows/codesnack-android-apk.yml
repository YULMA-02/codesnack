name: Build CodeSnack Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/codesnack-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android debug APK
        run: gradle -p android --no-daemon :app:assembleDebug --stacktrace

      - name: Make APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/CodeSnack-Android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeSnack-Android-APK
          path: output/CodeSnack-Android-debug.apk
          retention-days: 30
          if-no-files-found: error

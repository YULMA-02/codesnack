plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yulma02.codesnack'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.yulma02.codesnack'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

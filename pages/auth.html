<!-- CodeSnack page: view-auth. Loaded by index.html -->
<section id="view-auth" class="hidden max-w-md mx-auto py-8">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700/60 p-6 sm:p-8">
                <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                    <button id="tab-login-btn" onclick="switchAuthTab('login')" class="w-1/2 pb-3 text-center text-sm font-extrabold border-b-2 border-emerald-500 dynamic-border text-slate-900 dark:text-slate-100 transition">
                        로그인
                    </button>
                    <button id="tab-signup-btn" onclick="switchAuthTab('signup')" class="w-1/2 pb-3 text-center text-sm font-extrabold border-b-2 border-transparent text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                        회원가입
                    </button>
                </div>

                <!-- 로그인 폼 -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">아이디</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" id="login-id" required placeholder="아이디를 입력하세요" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">비밀번호</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="password" id="login-password" required placeholder="비밀번호를 입력하세요" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox" id="show-login-password" onchange="togglePasswordVisibility('login-password', this.checked)" class="w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 border-slate-300 dark:border-slate-700 cursor-pointer">
                        <label for="show-login-password" class="text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer select-none">비밀번호 표시</label>
                    </div>

                    <label for="login-remember-me" class="cs-remember-login">
                        <input type="checkbox" id="login-remember-me" aria-describedby="remember-login-help">
                        <span class="cs-remember-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
                        <span class="cs-remember-content">
                            <strong>자동 로그인 유지</strong>
                            <small id="remember-login-help">선택하면 브라우저를 다시 열어도 로그인 상태가 유지돼요.</small>
                        </span>
                    </label>

                    <button type="submit" class="w-full py-3 mt-2 dynamic-bg dynamic-hover-bg text-slate-900 font-extrabold rounded-xl text-sm shadow transition">
                        로그인하기
                    </button>
                </form>

                <!-- 회원가입 폼 (3가지 계정 유형 선택 포함) -->
                <form id="form-signup" onsubmit="handleSignup(event)" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">계정 유형 선택</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="signup-role-radio" value="general" checked onchange="toggleRoleFields(this.value)" class="peer hidden">
                                <div class="text-center py-2.5 px-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-500 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 peer-checked:text-emerald-400 transition">
                                    <i class="fa-solid fa-user block mb-1 text-sm"></i>일반인
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="signup-role-radio" value="student" onchange="toggleRoleFields(this.value)" class="peer hidden">
                                <div class="text-center py-2.5 px-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-500 peer-checked:border-sky-500 peer-checked:bg-sky-500/10 peer-checked:text-sky-400 transition">
                                    <i class="fa-solid fa-user-graduate block mb-1 text-sm"></i>학생
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="signup-role-radio" value="teacher" onchange="toggleRoleFields(this.value)" class="peer hidden">
                                <div class="text-center py-2.5 px-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-500 peer-checked:border-purple-500 peer-checked:bg-purple-500/10 peer-checked:text-purple-400 transition">
                                    <i class="fa-solid fa-chalkboard-user block mb-1 text-sm"></i>선생님
                                </div>
                            </label>
                        </div>
                        <input type="hidden" id="signup-role" value="general">
                    </div>

                    <!-- 학생 선택 시 나타나는 선생님 초대 코드 입력창 -->
                    <div id="teacherCodeField" class="hidden">
                        <label class="block text-xs font-bold uppercase text-sky-400 mb-1">선생님 연동 코드 (선택)</label>
                        <div class="relative">
                            <i class="fa-solid fa-link absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" id="signup-teacher-code" placeholder="선생님 코드 입력, 가입 후에도 등록 가능)" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-sky-500/40 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 uppercase font-mono">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">닉네임 (이름)</label>
                        <div class="relative">
                            <i class="fa-solid fa-id-card absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" id="signup-nickname" required placeholder="사용할 이름 또는 닉네임을 입력하세요" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">아이디</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="text" id="signup-id" required placeholder="사용할 아이디를 입력하세요" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">비밀번호</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-sm"></i>
                            <input type="password" id="signup-password" required placeholder="비밀번호 6자리 이상 입력하세요" class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox" id="show-signup-password" onchange="togglePasswordVisibility('signup-password', this.checked)" class="w-4 h-4 rounded text-emerald-500 focus:ring-emerald-400 border-slate-300 dark:border-slate-700 cursor-pointer">
                        <label for="show-signup-password" class="text-xs font-bold text-slate-600 dark:text-slate-300 cursor-pointer select-none">비밀번호 표시</label>
                    </div>

                    <button type="submit" class="w-full py-3 mt-2 dynamic-bg dynamic-hover-bg text-slate-900 font-extrabold rounded-xl text-sm shadow transition">
                        회원가입 완료
                    </button>
                </form>
            </div>
        </section>
